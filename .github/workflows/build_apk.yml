name: Build Final Signed AvangVPN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Release Keystore
        run: |
          if [ ! -f app/avang_release.jks ]; then
            keytool -genkeypair -v \
              -keystore app/avang_release.jks \
              -alias avang_alias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass AvangPassword123 \
              -keypass AvangPassword123 \
              -dname "CN=JRweb, OU=Dev, O=JRweb, L=Tehran, S=Tehran, C=IR"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AvangVPN-Final-Signed
          path: app/build/outputs/apk/release/app-release.apk
